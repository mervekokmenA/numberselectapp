name: Hızlı On Sonuçlarını Güncelle

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub zamanlayıcısı yoğunlukta gecikebilir (genelde 5-20 dk)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-hizlion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Veri, ana dalı şişirmemek için ayrı 'hizlion-data' dalında TEK commit olarak tutulur (her seferinde ezilir).
      - name: Mevcut veriyi al
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin hizlion-data >/dev/null 2>&1; then
            git fetch --depth=1 origin hizlion-data
            git show FETCH_HEAD:hizlion.json > data/hizlion.json
          else
            cp hizlion.json data/hizlion.json
          fi
          cp data/hizlion.json data/onceki.json

      - name: Tarayıcıyı kur
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Yeni çekilişleri topla
        run: |
          for i in 1 2 3; do
            if node scripts/update-hizlion.mjs data/hizlion.json; then exit 0; fi
            echo "Deneme $i başarısız, bekleniyor..."; sleep $((i * 20))
          done
          echo "Üç denemede de başarısız (Milli Piyango erişimi engellenmiş olabilir)." >&2
          exit 1

      - name: Değiştiyse yayınla
        run: |
          if cmp -s data/hizlion.json data/onceki.json; then echo "Yeni çekiliş yok."; exit 0; fi
          cd data
          rm onceki.json
          git init -q -b hizlion-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hizlion.json
          git commit -q -m "Hızlı On verisi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hizlion-data
